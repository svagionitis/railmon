[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railmon"
dynamic = ["version"]
description = "Hellenic Railways (railway.gov.gr) Live Train Tracker & Terminal Map"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hellenic Train Tracking Contributors" },
]
keywords = [
    "railway",
    "trains",
    "curses",
    "tui",
    "greece",
    "telemetry",
    "sse",
    "transit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

# Zero external runtime dependencies on Linux/macOS!
# Only windows-curses is required on Windows platforms for curses support.
dependencies = [
    'windows-curses>=2.4.0; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.4.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.7.0",
    "black>=23.7.0",
    "ruff>=0.4.0",
    "bandit>=1.7.5",
]

[project.scripts]
railmon = "train_tracker:main"

[project.urls]
Homepage = "https://railway.gov.gr"
Repository = "https://github.com/svagionitis/railmon"
Issues = "https://github.com/svagionitis/railmon/issues"

[tool.setuptools.dynamic]
version = { attr = "train_tracker.__version__" }

[tool.setuptools]
py-modules = ["train_tracker", "railmon_watchdog"]
packages = ["storage", "tui", "tui.data", "server", "exporter", "gtfs_rt"]

[tool.setuptools.package-data]
"tui.data" = ["*.json"]

# Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["train_tracker.py", "railmon_watchdog.py", "storage", "tui", "server", "exporter", "gtfs_rt", "tests"]

[tool.ruff.lint]
# Enforces MISRA / AUTOSAR / NASA JPL style static safety rules:
# E/W (pycodestyle), F (Pyflakes), B (flake8-bugbear), BLE (blind-except),
# C90 (mccabe complexity), S (bandit security), RET (return consistency),
# SIM (simplify), PIE (misc lints), PL (Pylint), RUF (Ruff-specific)
select = ["E", "W", "F", "B", "BLE", "C90", "S", "RET", "SIM", "PIE", "PLC", "PLE", "PLW", "RUF"]
ignore = ["E501", "S101", "S311"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE", "C90", "RET"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B311"]

[tool.coverage.run]
source = ["train_tracker", "railmon_watchdog", "storage", "tui", "server", "exporter", "gtfs_rt"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
