[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railmon"
dynamic = ["version"]
description = "Hellenic Railways (railway.gov.gr) Live Train Tracker & Terminal Map"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hellenic Train Tracking Contributors" },
]
keywords = [
    "railway",
    "trains",
    "curses",
    "tui",
    "greece",
    "telemetry",
    "sse",
    "transit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

# Zero external runtime dependencies on Linux/macOS!
# Only windows-curses is required on Windows platforms for curses support.
dependencies = [
    'windows-curses>=2.4.0; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.4.0",
    "flake8>=6.0.0",
    "black>=23.7.0",
]

[project.scripts]
railmon = "train_tracker:main"

[project.urls]
Homepage = "https://railway.gov.gr"
Repository = "https://github.com/svagionitis/railmon"
Issues = "https://github.com/svagionitis/railmon/issues"

[tool.setuptools.dynamic]
version = { attr = "train_tracker.__version__" }

[tool.setuptools]
py-modules = ["train_tracker"]
packages = ["storage", "tui", "tui.data"]

[tool.setuptools.package-data]
"tui.data" = ["*.json"]

# Tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["train_tracker", "storage", "tui"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
